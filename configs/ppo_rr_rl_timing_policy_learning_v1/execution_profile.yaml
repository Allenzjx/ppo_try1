schema: wlr50_clean.semantic_execution_profile.v1
revision: rr_live_swing_evidence_v3
rear_policy_timing_mode: rr_live_swing_evidence_v3
capture_assist_mode: p05_hip_only_continuation_v1
rr_capture_assist_mode: null
rr_capture_feedback_revision: null
rr_capture_wheel_mode: "off"
physics_hz: 120.0
decision_hz: 15.0
episode_timeout_s: 200.0
timeout_semantics: finite_horizon_task_termination_no_bootstrap_remaining_time_observed
modes:
  legacy_fsm_eval: frozen_controller_and_mapper
  semantic_prior_eval: task_supervisor_plus_nominal_zero_residual
  semantic_residual_train: task_supervisor_plus_nominal_plus_sampled_residual
  semantic_residual_eval: task_supervisor_plus_nominal_plus_deterministic_residual
mapper_version: unchanged_frozen_servo_target_mapper
nominal_geometry_advisory: null
level_reference_orientation_wxyz: [1.0, 0.0, 0.0, 0.0]
level_definition: fixed_chassis_axes_relative_to_world_gravity_not_episode_initial_tilt
residual:
  action_dimension: 12
  bounded_transform: tanh
  latent_distribution: gaussian_raw_action_log_probability
  initial_servo_cap_deg: 4.0
  # Symmetric requested search ranges, intersected with measured mapper/actuator headroom.
  # Nondecreasing along the phase graph: handoff cannot abruptly shrink a live residual.
  # Rear preparation onward: front wheels can cancel strong finite nominal suggestions.
  # Early wheels can cancel and reverse a +0.3 rad/s pending-capture suggestion.
  # FR knee 112 covers a -40 degree candidate from nominal 45.9 plus up to
  # 10 mapper and 10 controller correction; it is not a required support pose.
  # Actual wheel hard bounds and the 1.8 rad/s2 residual slew remain unchanged.
  # Late FL hip 32 permits finite-latent cancellation of the observed 26.4 deg
  # P07 advisory increment, with margin. This is not a required joint pose,
  # a larger noise parameter, or a guarantee of physical stability.
  # P03 FL/RL can cancel and reverse the recorded -0.79/+0.61 wheel suggestions.
  # Preserve these two ranges downstream: the existing handoff guard forbids cap shrinkage.
  phase_caps_full12:
    P01: [18, 24, 18, 24, 12, 18, 12, 18, 0.6, 0.6, 0.6, 0.6]
    P02: [18, 24, 18, 24, 12, 18, 12, 18, 0.6, 0.6, 0.6, 0.6]
    P03: [18, 24, 18, 24, 12, 18, 12, 18, 1, 0.6, 1, 0.6]
    P04: [18, 24, 18, 24, 12, 18, 12, 18, 1, 0.6, 1, 0.6]
    P05: [18, 24, 18, 24, 12, 18, 12, 18, 1, 0.6, 1, 0.6]
    P06: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P07: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P08: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P09: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P10: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P11: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P12: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
    P13: [32, 36, 24, 112, 24, 36, 24, 36, 1.2, 1.2, 1, 0.6]
  initial_wheel_cap_rad_s: 0.12
  servo_rate_deg_s: 60.0
  wheel_rate_rad_s2: 1.8
  allowed_channels: all_12_in_every_phase
  closed_channels: {}
  channel_rationale: all_joints_for_support_and_swing_coordination_all_wheels_for_rolling_transfer_and_capture_including_FR_in_P08_P11
  recording_percentage_hard_limit: false
  same_tick_atomic_dispatch: true
  injection: post_mapper
  composition: independent_post_mapper_residual.v1
  policy_headroom_mode: same_tick_post_mapper_servo_margin_v1
  tracking_reference_mode: previous_ack_requested_servo_reference_v1
  # A local computational tracking reference uses the previous ACK's filtered
  # REQUEST, already observable in the 324-column history. It never changes
  # real measured q, nominal commands, or the frozen mapper implementation.
  # The desired correction is bounded relative to the same-real-state original
  # law and 2-degree reserve; this is NOT a global final-target reserve claim.
  # Existing correction slew, baseline exceptions, geometry and hard limits remain.
  # The 2 degree reserve is applied after this tick's mapper/nominal geometry
  # and bounded controller bias. Previous residual observation remains the
  # filtered request; actual actuator history remains the final slewed drive.
  phase_handoff: retain_feasible_history_and_slew_to_new_target_no_global_zero
  cap_changes: version_boundary_only_with_physical_response_and_saturation_evidence
  safety_projection_scope: hard_actuator_bounds_and_reactive_stop_not_predictive_collision_avoidance
reset:
  initial_mode: natural_P01_locked_scene_settle
  acceptance: current_sensor_validity_and_physical_safety_not_historical_state_equality
  curriculum_fallback: natural_no_credit_rollin_from_P01
  state_writes_after_episode_start: prohibited
training_budgets:
  smoke: 10000
  phase_suffix: 100000
  full_episode: 131072
sampling_target:
  full_P01: 0.25
  predecessor_P07_suffix: 0.50
  second_rear_P10_suffix: 0.25
  actual_scheduler: configs/ppo_rr_rl_timing_policy_learning_v1/curriculum_plan.json
seeds:
  train: [1001, 1002, 1003, 1004, 1005, 1006, 1007, 1008]
  validation: [2001, 2002, 2003, 2004, 2005]
  locked_test: [3001, 3002, 3003, 3004, 3005]
  video: 4001
evaluation:
  randomization: false
  seed_interpretation: deterministic_repetition_not_random_robustness
  quality_goal_relative_improvement: 0.05
  quality_goal_is_task_failure: false
  comparisons: [A_to_C, B_to_C]
  initial_actor_mean: zero
  hidden_dims: [256, 256]
