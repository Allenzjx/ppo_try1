schema: wlr50_clean.semantic_reward.v2
revision: task_first_recovery_epsilon_zero_v1
objective_profile: task_first_recovery_v1
quality_epsilon: 0.0
# Independent recovery objective. Existing safety/task terminals and N unchanged.
# The five-family schema is retained; pure secondary costs are diagnostic only.
return_profile: v3_gamma_09985_lambda_099_v1
contact_loss_semantics: recent_touchdown_without_active_command_change
smoothness_components: applied_only
physical_transfer_weighting: true
carry_body_allowance: current_functional_carry_and_capture_settle_v1
capture_settle_window_s: 0.5
# Only diagonal_transfer_roles_v1 tasks extend the existing attitude blend to
# Euler rates and angular acceleration. Reuse transfer_attitude_weight; no new
# family, coefficient, phase-label switch, or AIR/contact penalty is introduced.
rebound_window_s: 0.25
rebound_command_motion_deg: 0.1
gamma: 0.9985
physics_hz: 120.0
decision_hz: 15.0
maximum_task_duration_s: 200.0
time_limit_semantics: finite_horizon_task_termination_no_bootstrap
potential_terminal_value: 0.0
potential_weight: 5.0
success_reward: 40.0
failure_cost: 40.0
time_cost_per_s: 0.02
family_weights:
  task_progress: 1.0
  body_stability: 0.0
  contact_motion_quality: 0.0
  control_smoothness: 0.0
  control_regularization: 0.0
transfer_attitude_weight: 0.2
transfer_contact_weight: 0.2
attitude_scale_rad: 0.5
euler_rate_scale_rad_s: 2.0
angular_acceleration_scale_rad_s2: 20.0
touchdown_speed_allowance_m_s: 0.05
touchdown_speed_scale_m_s: 0.5
slip_speed_allowance_m_s: 0.15
slip_speed_scale_m_s: 0.5
control_regularization_enabled: false
signal_ownership:
  task_progress: [global_physical_potential, finite_task_elapsed_time, task_terminal_event]
  body_stability: [gravity_attitude, euler_roll_pitch_derivative, body_angular_acceleration]
  contact_motion_quality: [touchdown_vertical_speed, touchdown_load, post_contact_rebound, contact_chatter, uncontrolled_contact_slip]
  control_smoothness: [actual_drive_first_difference, actual_drive_second_difference]
  control_regularization: [projected_residual_magnitude]
reference_imitation_reward: false
phase_label_transition_bonus: false
nonzero_residual_bonus: false
cost_integration: actual_physics_time
normalization: fixed_engineering_scales_not_reference_statistics
